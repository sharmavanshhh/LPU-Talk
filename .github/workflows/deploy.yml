name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          password: ${{ secrets.DROPLET_PASSWORD }}
          script: |
            cd /var/www/LPU-Talk
            
            # Force pull latest changes (clears conflicts)
            git fetch origin main
            git reset --hard origin/main
            
            # Setup Backend
            cd backend
            npm install --omit=dev
            pm2 restart LPU_BACKEND || pm2 start server.js --name LPU_BACKEND
            
            # Setup Frontend
            cd ../frontend
            npm install
            
            # Increase memory limit for build
            export NODE_OPTIONS="--max-old-space-size=2048"
            npm run build
            
            # Final permission check and Nginx restart
            sudo chmod -R 755 /var/www/LPU-Talk/frontend/build
            sudo systemctl restart nginx
